appId: dev.veltrix.app
productName: Veltrix
directories:
  # icon.png here is converted to .ico / .icns for each platform.
  buildResources: resources
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  # No Developer ID certificate yet: sign ad hoc, which Apple Silicon requires to launch.
  # The hardened runtime is only needed for notarization, and without entitlements it
  # would stop Electron's JIT, so it stays off until the app is notarized.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  # Name both architectures; the default leaves "x64" out of the Intel build's name.
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # No spaces: GitHub renames release assets with spaces, which breaks re-uploads.
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# node-pty ships prebuilt N-API binaries that load in Electron as-is; rebuilding would
# require a C++ toolchain for no benefit.
npmRebuild: false
